<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c2185b" />
    <title>Холболт алга — Цэцэглэн</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #faf8f5;
        color: #1a1a1a;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
        color: #c2185b;
      }
      p {
        margin: 0 0 24px;
        color: #6b5e54;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        background: #c2185b;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icon-192.png" alt="Цэцэглэн" />
      <h1>Интернэт холболт алга байна</h1>
      <p>
        Цэцэглэнг үзэхэд интернэт холболт шаардлагатай. Холболтоо шалгаад дахин
        оролдоно уу.
      </p>
      <button onclick="location.reload()">Дахин оролдох</button>
    </div>
  </body>
</html>
